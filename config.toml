baseURL = "https://www.danieltregeagle.com/"
relativeURLs = true
canonifyURLs = true
locale = "en-us"
title = "Daniel Tregeagle, Ph.D."
theme = "anatole"

[params]
  title = "Daniel Tregeagle, Ph.D."
  author = "Daniel Tregeagle"
  description = "Associate Professor and\nExtension Specialist\nAgricultural and Resource Economics\nNC State University"
  profilePicture = "photos/danielTregeaglePicture2.JPG"
  # No post list on the home page: these are all standalone pages.
  mainSections = ["post"]
  disableTitleCapitalization = true
  doNotLoadAnimations = true
  customCss = ["css/custom.css"]
  googleFonts = ["Inter:wght@400;500;600"]
  # Main column share of the page width (theme default 0.6); the sidebar gets
  # the rest. The text itself is capped in custom.css, leaving white space
  # to its right.
  contentratio = 0.8

  [[params.socialIcons]]
    icon = "fa-solid fa-envelope"
    title = "Email"
    url = "mailto:tregeagle@ncsu.edu"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  posts = "/:slug/"

[menu]

  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Research"
    url = "/research/"
    weight = 2

  [[menu.main]]
    name = "Teaching"
    url = "/teaching/"
    weight = 3

  [[menu.main]]
    name = "Extension"
    url = "/extension/"
    weight = 4

  [[menu.main]]
    name = "CV"
    url = "/cv/"
    weight = 5
